<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
     [class.bg-white]="isScrolled()"
     [class.shadow-lg]="isScrolled()"
     [class.bg-transparent]="!isScrolled()">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-20">

      <!-- Logo -->
      <button (click)="scrollToSection('hero')"
              class="transition-colors duration-300"
              [class.text-navy]="isScrolled()"
              [class.text-white]="!isScrolled()">
        <span class="text-2xl font-semibold">Rancho</span>
        <span class="text-2xl font-semibold text-gold ml-1">Sacuanjoche</span>
      </button>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center space-x-8">
        <button (click)="scrollToSection('hero')"
                class="transition-colors duration-300 hover:text-gold"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Inicio
        </button>
        <button (click)="scrollToSection('events')"
                class="transition-colors duration-300 hover:text-gold"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Eventos
        </button>
        <button (click)="scrollToSection('gallery')"
                class="transition-colors duration-300 hover:text-gold"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Galería
        </button>
        <button (click)="scrollToSection('packages')"
                class="transition-colors duration-300 hover:text-gold"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Paquetes
        </button>
        <button (click)="scrollToSection('booking')"
                class="bg-gold text-navy px-6 py-2.5 rounded-lg hover:bg-gold-light
                       transition-all duration-300 shadow-lg hover:shadow-xl
                       transform hover:scale-105 font-semibold">
          Reservar
        </button>
        <button (click)="scrollToSection('contact')"
                class="transition-colors duration-300 hover:text-gold"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Contacto
        </button>
      </div>

      <!-- Hamburger -->
      <button (click)="toggleMenu()"
              class="md:hidden transition-colors duration-300"
              [class.text-navy]="isScrolled()"
              [class.text-white]="!isScrolled()">
        <svg *ngIf="!isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg"
             class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg *ngIf="isMobileMenuOpen()" xmlns="http://www.w3.org/2000/svg"
             class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMobileMenuOpen()"
       class="md:hidden bg-white border-t border-gray-200">
    <div class="px-4 pt-2 pb-4 space-y-3">
      <button (click)="scrollToSection('hero')"
              class="block w-full text-left px-4 py-3 text-navy hover:bg-gold/10 rounded-lg transition-colors">
        Inicio
      </button>
      <button (click)="scrollToSection('events')"
              class="block w-full text-left px-4 py-3 text-navy hover:bg-gold/10 rounded-lg transition-colors">
        Eventos
      </button>
      <button (click)="scrollToSection('gallery')"
              class="block w-full text-left px-4 py-3 text-navy hover:bg-gold/10 rounded-lg transition-colors">
        Galería
      </button>
      <button (click)="scrollToSection('packages')"
              class="block w-full text-left px-4 py-3 text-navy hover:bg-gold/10 rounded-lg transition-colors">
        Paquetes
      </button>
      <button (click)="scrollToSection('booking')"
              class="block w-full text-left px-4 py-3 bg-gold text-navy rounded-lg font-semibold">
        Reservar Evento
      </button>
      <button (click)="scrollToSection('contact')"
              class="block w-full text-left px-4 py-3 text-navy hover:bg-gold/10 rounded-lg transition-colors">
        Contacto
      </button>
    </div>
  </div>
</nav>
