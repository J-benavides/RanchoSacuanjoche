<!-- Botón hamburguesa móvil -->
<button (click)="toggleMenu()"
        class="fixed top-4 left-4 z-[60] md:hidden w-10 h-10 rounded-xl
               flex items-center justify-center transition-all duration-300"
        style="background: #0a1628; border: 1px solid rgba(201,168,76,0.4);">
  @if (!isOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
         viewBox="0 0 24 24" stroke="#c9a84c" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
         viewBox="0 0 24 24" stroke="#c9a84c" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  }
</button>

<!-- Overlay oscuro en móvil -->
@if (isOpen()) {
  <div class="fixed inset-0 z-[55] bg-black/60 md:hidden"
       (click)="toggleMenu()">
  </div>
}

<!-- Sidebar -->
<div class="fixed left-0 top-0 h-screen z-[56] flex flex-col
            transition-transform duration-300 ease-in-out"
     style="width: 256px; background-color: #0a1628;
            border-right: 1px solid rgba(201,168,76,0.2);"
     [class.translate-x-0]="isOpen()"
     [class.-translate-x-full]="!isOpen()"
     [class.md:translate-x-0]="true">

  <!-- Logo -->
  <div class="p-6" style="border-bottom: 1px solid rgba(201,168,76,0.2);">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl flex-shrink-0"
           style="background: linear-gradient(135deg, #c9a84c, #d4b75f);">
        🌴
      </div>
      <div>
        <h2 class="text-white font-bold text-sm">Rancho</h2>
        <p class="text-xs" style="color: #c9a84c;">Sacuanjoche</p>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 py-6 px-3 overflow-y-auto">
    <ul class="space-y-1">
      @for (item of menuItems; track item.id) {
        <li>
          <button (click)="navigate(item.path)"
                  class="w-full flex items-center gap-3 px-4 py-3 rounded-xl
                         transition-all duration-300 text-sm"
                  [style.background]="isActive(item.path) ? '#c9a84c' : 'transparent'"
                  [style.color]="isActive(item.path) ? '#0a1628' : '#9ca3af'"
                  [style.fontWeight]="isActive(item.path) ? '600' : '400'">

            @if (item.icon === 'grid') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0
                         01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0
                         016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0
                         01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0
                         012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0
                         0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25
                         0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0
                         0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
              </svg>
            }
            @if (item.icon === 'calendar') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0
                         012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18
                         0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0
                         0021 18.75m-18 0v-7.5A2.25 2.25 0
                         015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/>
              </svg>
            }
            @if (item.icon === 'calendar-days') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0
                         012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18
                         0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0
                         0021 18.75m-18 0v-7.5A2.25 2.25 0
                         015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5
                         m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0
                         2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0
                         2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0
                         2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0
                         2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0
                         2.25h.008v.008H16.5V15z"/>
              </svg>
            }
            @if (item.icon === 'image') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M2.25 15.75l5.159-5.159a2.25 2.25 0
                         013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25
                         0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0
                         001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0
                         002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375
                         0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
              </svg>
            }
            @if (item.icon === 'package') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M20.25 7.5l-.625 10.632a2.25 2.25 0
                         01-2.247 2.118H6.622a2.25 2.25 0
                         01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621
                         0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621
                         0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
              </svg>
            }
            @if (item.icon === 'star') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M11.48 3.499a.562.562 0 011.04 0l2.125
                         5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204
                         3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0
                         01-.84.61l-4.725-2.885a.563.563 0
                         00-.586 0L6.982 20.54a.562.562 0
                         01-.84-.61l1.285-5.386a.562.562 0
                         00-.182-.557l-4.204-3.602a.562.562 0
                         01.321-.988l5.518-.442a.563.563 0
                         00.475-.345L11.48 3.5z"/>
              </svg>
            }
            @if (item.icon === 'settings') {
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0"
                   fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55
                         0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257
                         1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125
                         1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759
                         6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26
                         1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57
                         6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55
                         0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52
                         0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125
                         0 01-1.369-.49l-1.297-2.247a1.125 1.125 0
                         01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932
                         0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125
                         0 01-.26-1.43l1.297-2.247a1.125 1.125 0
                         011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            }

            <span>{{ item.label }}</span>
          </button>
        </li>
      }
    </ul>
  </nav>

  <!-- Admin profile -->
  <div class="p-4" style="border-top: 1px solid rgba(201,168,76,0.2);">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-10 h-10 rounded-full bg-gray-700 flex items-center
                  justify-center text-white text-sm font-semibold flex-shrink-0">
        AD
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-white text-sm font-medium truncate">Administrador</p>
        <p class="text-gray-500 text-xs truncate">admin&#64;rancho.com</p>
      </div>
    </div>
    <button (click)="logout()"
            class="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl
                   text-gray-400 hover:text-red-400 hover:bg-red-500/10
                   transition-all duration-300 text-sm border border-transparent
                   hover:border-red-500/30">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0
                 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25
                 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
      </svg>
      Cerrar sesión
    </button>
  </div>
</div>
