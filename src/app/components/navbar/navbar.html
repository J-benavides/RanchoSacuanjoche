<nav class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
     [class.bg-white]="isScrolled()"
     [class.shadow-lg]="isScrolled()"
     [class.bg-transparent]="!isScrolled()">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <button (click)="scrollToSection('hero')"
              class="transition-colors duration-300 flex-shrink-0"
              [class.text-navy]="isScrolled()"
              [class.text-white]="!isScrolled()">
        <span class="text-lg font-semibold">Rancho</span>
        <span class="text-lg font-semibold text-gold ml-1">Sacuanjoche</span>
      </button>

      <!-- Desktop links -->
      <div class="hidden md:flex items-center space-x-6">
        <button (click)="scrollToSection('hero')"
                class="transition-colors duration-300 hover:text-gold text-sm"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Inicio
        </button>
        <button (click)="scrollToSection('events')"
                class="transition-colors duration-300 hover:text-gold text-sm"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Eventos
        </button>
        <button (click)="scrollToSection('gallery')"
                class="transition-colors duration-300 hover:text-gold text-sm"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Galería
        </button>
        <button (click)="scrollToSection('packages')"
                class="transition-colors duration-300 hover:text-gold text-sm"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Paquetes
        </button>
        <button (click)="scrollToSection('booking')"
                class="bg-gold text-navy px-5 py-2 rounded-lg hover:bg-gold-light
                       transition-all duration-300 shadow-lg font-semibold text-sm">
          Reservar
        </button>
        <button (click)="scrollToSection('contact')"
                class="transition-colors duration-300 hover:text-gold text-sm"
                [class.text-navy]="isScrolled()"
                [class.text-white]="!isScrolled()">
          Contacto
        </button>
      </div>

      <!-- Hamburger -->
      <button (click)="toggleMenu()"
              class="md:hidden transition-colors duration-300 p-2"
              [class.text-navy]="isScrolled()"
              [class.text-white]="!isScrolled()">
        @if (!isMobileMenuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile menu — pantalla completa elegante -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden fixed inset-0 z-40 bg-navy/98 backdrop-blur-md
                flex flex-col">

      <!-- Header del menú -->
      <div class="flex justify-between items-center px-6 py-4 border-b border-white/10">
        <span class="text-white font-semibold">
          Rancho <span class="text-gold">Sacuanjoche</span>
        </span>
        <button (click)="toggleMenu()" class="text-white/70 hover:text-white p-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Links -->
      <div class="flex flex-col px-6 py-8 space-y-1 flex-1">
        @for (link of [
          {label: 'Inicio', id: 'hero'},
          {label: 'Eventos', id: 'events'},
          {label: 'Galería', id: 'gallery'},
          {label: 'Paquetes', id: 'packages'},
          {label: 'Contacto', id: 'contact'}
        ]; track link.id) {
          <button (click)="scrollToSection(link.id)"
                  class="text-left py-4 text-white/80 hover:text-gold
                         font-medium text-lg border-b border-white/10
                         transition-colors duration-200 flex items-center
                         justify-between group">
            {{ link.label }}
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="w-4 h-4 text-white/30 group-hover:text-gold transition-colors"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        }
      </div>

      <!-- CTA al fondo -->
      <div class="px-6 pb-10 space-y-3">
        <button (click)="scrollToSection('booking')"
                class="w-full bg-gold text-navy py-4 rounded-xl font-bold
                       text-base hover:bg-gold-light transition-all shadow-lg">
          Reservar Evento
        </button>
        <a href="https://wa.me/50662969944"
           target="_blank"
           class="w-full flex items-center justify-center gap-2 py-3
                  border border-white/20 text-white/70 rounded-xl text-sm
                  hover:border-green-400 hover:text-green-400 transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4"
               fill="currentColor" viewBox="0 0 24 24">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Escribir por WhatsApp
        </a>
      </div>
    </div>
  }
</nav>
