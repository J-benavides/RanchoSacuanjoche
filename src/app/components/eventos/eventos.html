<section id="events" class="py-20 px-4 sm:px-6 lg:px-8 bg-gradient-to-b from-white to-gray-50">
  <div class="max-w-7xl mx-auto">

    <div class="text-center mb-16">
      <h2 class="text-4xl sm:text-5xl font-bold text-navy mb-4">
        Tipos de <span class="text-gold">Eventos</span>
      </h2>
      <p class="text-xl text-gray-600 max-w-2xl mx-auto">
        Espacios versátiles diseñados para hacer realidad cada celebración
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (evento of eventos; track evento.title) {
        <div class="group relative bg-white rounded-2xl overflow-hidden shadow-lg
                    hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2">

          <div class="relative h-48 overflow-hidden">
            <img [src]="evento.image" [alt]="evento.title"
                 class="w-full h-full object-cover transform
                        group-hover:scale-110 transition-transform duration-500"/>
            <div class="absolute inset-0 bg-gradient-to-t from-navy/80 to-transparent"></div>
          </div>

          <div class="p-6">
            <h3 class="text-xl font-bold text-navy mb-2">{{ evento.title }}</h3>
            <p class="text-gray-600 mb-4 text-sm leading-relaxed">{{ evento.description }}</p>
            <span class="text-sm text-gold font-semibold block mb-4">{{ evento.capacity }}</span>
            <button (click)="scrollToBooking()"
                    class="w-full bg-navy text-white py-2.5 rounded-lg
                           hover:bg-navy-light transition-colors duration-300 font-semibold">
              Cotizar
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</section>
