<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden"
     style="background-color: #0a1628;">

  <!-- Patrón de fondo -->
  <div class="absolute inset-0 opacity-10"
       style="background-image: radial-gradient(circle, #c9a84c 1px, transparent 1px);
              background-size: 30px 30px;">
  </div>

  <!-- Orbes decorativos -->
  <div class="absolute top-0 left-0 w-96 h-96 rounded-full opacity-10 blur-3xl pointer-events-none"
       style="background: #c9a84c;"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 rounded-full opacity-10 blur-3xl pointer-events-none"
       style="background: #c9a84c;"></div>

  <div class="relative z-10 w-full max-w-md">

    <!-- Logo y header -->
    <div class="text-center mb-8">
      <div class="mb-6 flex justify-center">
        <div class="w-24 h-24 rounded-full flex items-center justify-center text-5xl shadow-2xl"
             style="background: linear-gradient(135deg, #c9a84c, #d4b75f);">
          🌴
        </div>
      </div>
      <h1 class="text-3xl font-bold mb-2" style="color: #c9a84c;">
        Panel de Administración
      </h1>
      <p class="text-sm" style="color: #9ca3af;">
        Acceso exclusivo para administradores
      </p>
    </div>

    <!-- Card del login -->
    <div class="rounded-2xl p-8 shadow-2xl"
         style="background: rgba(255,255,255,0.05);
                border: 1px solid rgba(201,168,76,0.3);
                backdrop-filter: blur(16px);">

      <!-- Error -->
      @if (error()) {
        <div class="mb-6 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2"
             style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
                    color: #f87171;">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0"
               fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667
                     1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464
                     0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          {{ error() }}
        </div>
      }

      <div class="space-y-5">

        <!-- Usuario -->
        <div>
          <label class="block text-sm font-semibold mb-2" style="color: #d1d5db;">
            Usuario
          </label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                   viewBox="0 0 24 24" stroke="#9ca3af" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501
                         20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0
                         0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
            </div>
            <input type="text"
                   [ngModel]="username()"
                   (ngModelChange)="username.set($event)"
                   placeholder="Ingresá tu usuario"
                   class="w-full pl-11 pr-4 py-3 rounded-xl text-white text-sm
                          outline-none transition-all duration-300"
                   style="background: rgba(255,255,255,0.05);
                          border: 2px solid #4b5563;
                          placeholder-color: #6b7280;"
                   (focus)="$event.target.style.borderColor='#c9a84c'"
                   (blur)="$event.target.style.borderColor='#4b5563'"/>
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-sm font-semibold mb-2" style="color: #d1d5db;">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                   viewBox="0 0 24 24" stroke="#9ca3af" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75
                         11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25
                         2.25 0 00-2.25-2.25H6.75a2.25 2.25 0
                         00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
              </svg>
            </div>
            <input [type]="showPassword() ? 'text' : 'password'"
                   [ngModel]="password()"
                   (ngModelChange)="password.set($event)"
                   placeholder="••••••••"
                   class="w-full pl-11 pr-12 py-3 rounded-xl text-white text-sm
                          outline-none transition-all duration-300"
                   style="background: rgba(255,255,255,0.05);
                          border: 2px solid #4b5563;"
                   (focus)="$event.target.style.borderColor='#c9a84c'"
                   (blur)="$event.target.style.borderColor='#4b5563'"
                   (keyup.enter)="login()"/>
            <button type="button" (click)="togglePassword()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 transition-colors"
                    style="color: #9ca3af;">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226
                           16.338 7.244 19.5 12 19.5c.993 0 1.953-.138
                           2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756
                           0 8.773 3.162 10.065 7.498a10.523 10.523 0
                           01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65
                           3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0
                           0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 010-.639C3.423
                           7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007
                           9.963 7.178.07.207.07.431 0 .639C20.577
                           16.49 16.64 19.5 12 19.5c-4.638
                           0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Botón login -->
        <button (click)="login()"
                [disabled]="cargando()"
                class="w-full py-3.5 rounded-xl font-bold text-sm
                       transition-all duration-300 flex items-center justify-center gap-2
                       disabled:opacity-50 disabled:cursor-not-allowed"
                style="background: #c9a84c; color: #0a1628;">
          @if (cargando()) {
            <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Ingresando...
          } @else {
            Ingresar
          }
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-8">
      <p class="text-xs" style="color: #6b7280;">
        © 2026 Rancho Sacuanjoche · Todos los derechos reservados
      </p>
    </div>
  </div>
</div>
