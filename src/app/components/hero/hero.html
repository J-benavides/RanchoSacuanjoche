<section id="hero" class="relative h-screen flex items-center justify-center overflow-hidden">

  <!-- Background image -->
  <div class="absolute inset-0 z-0">
    <img src="images/Banner.png"
         alt="Rancho Sacuanjoche"
         class="w-full h-full object-cover"/>
    <div class="absolute inset-0 bg-gradient-to-b from-navy/70 via-navy/50 to-navy/70"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-5xl mx-auto">

    <h1 class="text-5xl sm:text-6xl lg:text-7xl font-bold text-white mb-6 leading-tight animate-fade-up">
      Haz de tu evento un
      <span class="block text-gold mt-2">momento inolvidable</span>
    </h1>

    <p class="text-xl sm:text-2xl text-white/90 mb-10 max-w-3xl mx-auto">
      El escenario perfecto para bodas, graduaciones, celebraciones
      y eventos corporativos en Santa Cruz, Costa Rica
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
      <button (click)="scrollToSection('booking')"
              class="bg-gold text-navy px-8 py-4 rounded-lg hover:bg-gold-light
                     transition-all duration-300 shadow-2xl transform hover:scale-105
                     text-lg font-semibold w-full sm:w-auto">
        Reservar Evento
      </button>
      <button (click)="scrollToSection('packages')"
              class="bg-white/10 backdrop-blur-md text-white px-8 py-4 rounded-lg
                     border-2 border-white/30 hover:bg-white/20 hover:border-gold
                     transition-all duration-300 shadow-xl text-lg font-semibold
                     w-full sm:w-auto">
        Ver Paquetes
      </button>
    </div>

    <!-- Scroll down -->
    <div class="mt-16">
      <button (click)="scrollToSection('events')"
              class="text-white/80 hover:text-gold transition-colors duration-300
                     flex flex-col items-center mx-auto">
        <span class="text-sm mb-2">Descubre más</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-bounce"
             fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom fade -->
  <div class="absolute bottom-0 left-0 right-0 h-32
              bg-gradient-to-t from-white to-transparent z-10"></div>
</section>
